name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, types, code mort et tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run knip
      - run: npm test
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}

  e2e:
    name: Tests de bout en bout (${{ matrix.projet }}, ${{ matrix.part }}/3)
    runs-on: ubuntu-latest
    # La 3D tourne par SwiftShader, sur le processeur : un profil entier
    # dépasse 30 min sur un exécuteur GitHub, il se découpe donc en trois
    # parts lancées en parallèle.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        projet: [ordinateur, telephone]
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # WebGL par SwiftShader (arguments dans playwright.config.ts).
      - run: npm run test:e2e -- --project=${{ matrix.projet }} --shard=${{ matrix.part }}/3
        env:
          E2E_PORT: 3100
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: rapport-playwright-${{ matrix.projet }}-${{ matrix.part }}
          path: playwright-report/
          retention-days: 14
